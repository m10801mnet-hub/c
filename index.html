<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TOEIC 800 PRO</title>
<style>
  :root{
    --bg:#0E1116; --bg2:#11151C; --surface:#171C26; --surface2:#1E2530;
    --line:#27303D; --line2:#323D4D;
    --text:#E8ECF2; --muted:#8A94A6; --dim:#5E6878;
    --indigo:#7C9CFF; --indigo-deep:#3A4B7A; --indigo-bg:#161E33;
    --gold:#F4C04E; --gold-deep:#7A5E16;
    --green:#5FD0A0; --red:#E8718A;
    --r:16px; --r-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #161D2B 0%, var(--bg) 55%);
    color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
    min-height:100vh; overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 120px;}
  .hidden{display:none !important;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg, rgba(14,17,22,.96) 70%, rgba(14,17,22,0));
    padding:14px 16px 10px; max-width:560px; margin:0 auto;
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .logo{font-weight:800;letter-spacing:.04em;font-size:17px;}
  .logo .pro{color:var(--gold);font-size:12px;font-weight:700;margin-left:6px;letter-spacing:.12em;vertical-align:2px;}
  .count{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;}
  .count b{color:var(--indigo);font-size:15px;font-weight:800;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;margin-top:12px;background:var(--bg2);padding:5px;border-radius:14px;border:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted);border-radius:10px;cursor:pointer;transition:.18s;}
  .tab.active{background:var(--surface2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .tab .sub{display:block;font-size:10px;font-weight:600;color:var(--dim);margin-top:1px;}
  .tab.active .sub{color:var(--indigo);}

  /* ---------- start screen ---------- */
  .primer{padding:36px 22px;text-align:center;}
  .primer h1{font-size:30px;font-weight:800;letter-spacing:.04em;margin:8px 0 2px;}
  .primer h1 .pro{color:var(--gold);font-size:14px;letter-spacing:.16em;display:block;margin-top:6px;}
  .primer p{color:var(--muted);font-size:14px;margin:14px auto 26px;max-width:340px;}
  .stat-row{display:flex;gap:10px;justify-content:center;margin:0 0 28px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 6px;}
  .stat .n{font-size:24px;font-weight:800;color:var(--indigo);}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
  .big-btn{
    display:block;width:100%;padding:16px;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,var(--indigo) 0%,#9C7CFF 100%);
    color:#0B0E14;font-size:16px;font-weight:800;letter-spacing:.04em;
    box-shadow:0 10px 28px rgba(124,156,255,.35);transition:.15s;
  }
  .big-btn:active{transform:translateY(1px) scale(.995);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px;font-size:14px;}
  .toggle-row .sub{font-size:11px;color:var(--dim);margin-top:2px;}
  input[type=range]{accent-color:var(--indigo);}
  .switch{position:relative;width:46px;height:27px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--line2);border-radius:27px;transition:.2s;cursor:pointer;}
  .slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--indigo);}
  .switch input:checked + .slider:before{transform:translateX(19px);}

  /* ---------- countdown ---------- */
  .countdown{margin:14px 0 2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .countdown .lbl{font-size:12px;color:var(--muted);}
  .countdown .days{font-size:14px;font-weight:800;}
  .countdown .days b{color:var(--gold);font-size:22px;margin:0 3px;}

  /* ---------- mode chips ---------- */
  .modes{display:flex;gap:7px;margin:14px 0 4px;flex-wrap:wrap;}
  .chip{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.15s;}
  .chip.on{background:var(--indigo-bg);border-color:var(--indigo-deep);color:var(--indigo);}

  /* ---------- progress ---------- */
  .pbar-wrap{margin:14px 0 6px;}
  .pbar{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),#9C7CFF);transition:width .25s;border-radius:6px;}
  .pmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px;}

  /* ---------- timer ---------- */
  .timer{text-align:center;margin:10px 0 2px;}
  .timer .t{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;transition:color .2s;}
  .timer.warn .t{color:var(--gold);}
  .timer.danger .t{color:var(--red);}
  .tbar{height:5px;background:var(--surface2);border-radius:5px;overflow:hidden;margin-top:6px;}
  .tbar > i{display:block;height:100%;background:var(--indigo);width:100%;}

  /* ---------- card ---------- */
  .card{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:24px 20px;margin-top:14px;box-shadow:var(--shadow);
    overflow:hidden;
  }
  .qcat{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--indigo);text-transform:uppercase;margin-bottom:10px;}
  .word{font-size:38px;font-weight:800;letter-spacing:.01em;line-height:1.15;}
  .word .pos{font-size:13px;color:var(--muted);font-weight:600;margin-left:8px;vertical-align:5px;}
  .star{color:var(--gold);font-size:24px;margin-left:6px;vertical-align:4px;}
  .qtext{font-size:19px;font-weight:600;line-height:1.6;}
  .qtext u{ text-decoration:none;border-bottom:2px dashed var(--indigo);padding:0 18px;color:var(--indigo);font-weight:800;}
  .replay{display:inline-flex;align-items:center;gap:7px;margin-top:4px;padding:10px 16px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;}
  .replay:active{transform:scale(.97);}
  .listen-hint{text-align:center;color:var(--muted);font-size:13px;margin:6px 0;}

  /* ---------- options ---------- */
  .opts{margin-top:18px;display:flex;flex-direction:column;gap:9px;}
  .opt{
    text-align:left;padding:14px 16px;border-radius:12px;background:var(--surface2);
    border:1px solid var(--line);color:var(--text);font-size:16px;font-weight:600;cursor:pointer;
    transition:.12s;display:flex;align-items:center;gap:11px;
  }
  .opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);}
  .opt:active{transform:scale(.99);}
  .opt.correct{background:rgba(95,208,160,.14);border-color:var(--green);color:#cdebdd;}
  .opt.correct .k{background:var(--green);color:#0B1A14;border-color:var(--green);}
  .opt.wrong{background:rgba(232,113,138,.12);border-color:var(--red);color:#f4cdd6;}
  .opt.wrong .k{background:var(--red);color:#2a0c12;border-color:var(--red);}
  .opt.dim{opacity:.4;}
  .opt[disabled]{cursor:default;}

  /* ---------- celebration ---------- */
  .burst{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:5;}
  .rays{position:absolute;width:8px;height:8px;}
  .ray{position:absolute;left:50%;top:50%;width:3px;height:46px;border-radius:3px;background:linear-gradient(var(--gold),transparent);transform-origin:center top;opacity:0;}
  .burst.go .ray{animation:rayPop .7s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes rayPop{0%{opacity:0;transform:rotate(var(--rot)) translateY(0) scaleY(.2);}25%{opacity:1;}100%{opacity:0;transform:rotate(var(--rot)) translateY(-26px) scaleY(1.1);}}
  .glow{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(244,192,78,.4),transparent 70%);opacity:0;}
  .burst.go .glow{animation:glowPop .7s ease-out forwards;}
  @keyframes glowPop{0%{opacity:0;transform:scale(.3);}40%{opacity:1;}100%{opacity:0;transform:scale(1.6);}}
  .yatta{position:absolute;font-size:26px;font-weight:800;color:var(--gold);opacity:0;text-shadow:0 2px 12px rgba(244,192,78,.5);}
  .burst.go .yatta{animation:yattaRise 1s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes yattaRise{0%{opacity:0;transform:translateY(14px) scale(.8);}25%{opacity:1;transform:translateY(0) scale(1.05);}80%{opacity:1;}100%{opacity:0;transform:translateY(-30px) scale(1);}}

  /* ---------- learn panel ---------- */
  .learn{
    margin-top:14px;background:var(--indigo-bg);border:1px solid var(--indigo-deep);
    border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--shadow);
    animation:slideUp .28s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .learn .lh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--indigo);letter-spacing:.04em;margin-bottom:10px;}
  .learn .lh .ic{width:22px;height:22px;border-radius:7px;background:var(--indigo);color:#0B0E14;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
  .learn .ans{font-size:17px;font-weight:800;margin-bottom:8px;}
  .learn .ans .en{color:var(--green);}
  .learn .ans .ja{color:var(--text);}
  .learn .exp{font-size:14px;color:#cdd6ec;line-height:1.65;}
  .learn .exp .en{display:block;color:var(--muted);font-size:13px;margin-top:7px;font-style:italic;}
  .learn .ex{margin-top:11px;padding-top:11px;border-top:1px solid var(--indigo-deep);font-size:14px;}
  .learn .ex .e{color:var(--text);}
  .learn .ex .t{color:var(--muted);font-size:13px;}
  .next-btn{margin-top:14px;width:100%;padding:13px;border:none;border-radius:12px;background:var(--indigo);color:#0B0E14;font-size:15px;font-weight:800;cursor:pointer;}
  .next-btn:active{transform:translateY(1px);}

  /* ---------- correct-answer translation panel ---------- */
  .okjt{
    margin-top:14px;background:rgba(95,208,160,.08);border:1px solid rgba(95,208,160,.35);
    border-radius:var(--r);padding:15px 16px 13px;
    animation:slideUp .28s cubic-bezier(.2,.8,.3,1);
  }
  .jline{font-size:15px;line-height:1.6;color:var(--text);display:flex;gap:8px;align-items:flex-start;}
  .jtag{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--green);border:1px solid rgba(95,208,160,.5);border-radius:6px;padding:1px 7px;margin-top:3px;}
  .learn .jtag{color:var(--indigo);border-color:var(--indigo-deep);}
  .uline{font-size:13px;color:var(--muted);font-style:italic;margin-top:7px;padding-left:2px;}
  .taphint{margin-top:11px;text-align:center;font-size:12px;font-weight:700;color:var(--green);opacity:.85;animation:hintPulse 1.6s ease-in-out infinite;}
  @keyframes hintPulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  /* vocab example block (shown after answer) */
  .vex{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .vex .row{margin-bottom:9px;}
  .vex .e{font-size:15px;color:var(--text);}
  .vex .t{font-size:13px;color:var(--muted);}

  /* ---------- footer / reset ---------- */
  .foot{text-align:center;margin-top:26px;}
  .foot button{background:none;border:none;color:var(--dim);font-size:12px;text-decoration:underline;cursor:pointer;}

  /* ---------- done screen ---------- */
  .done{text-align:center;padding:40px 20px;}
  .done .big{font-size:46px;}
  .done h2{font-size:22px;font-weight:800;margin:10px 0 4px;}
  .done p{color:var(--muted);font-size:14px;}
  .done .score{font-size:40px;font-weight:800;color:var(--gold);margin:8px 0;}

  @media (prefers-reduced-motion: reduce){
    .burst.go .ray,.burst.go .glow,.burst.go .yatta,.learn{animation:none;}
  }
</style>
</head>
<body>

<!-- START -->
<div id="primer" class="wrap">
  <div class="primer">
    <h1>TOEIC 800<span class="pro">P R O</span></h1>
    <p>単語・文法スピードドリル・リスニングの3本立て。間違えた問題は<b style="color:var(--gold)">★</b>で記録し、出題頻度を自動で上げます。</p>
    <div class="stat-row">
      <div class="stat"><div class="n" id="pv">–</div><div class="l">単語</div></div>
      <div class="stat"><div class="n" id="pg">–</div><div class="l">文法</div></div>
      <div class="stat"><div class="n" id="pl">–</div><div class="l">リスニング</div></div>
    </div>
    <div class="toggle-row" style="margin-bottom:18px">
      <div style="flex:1"><div>試験日</div><div class="sub" id="examSub">残り日数を表示します</div></div>
      <input type="date" id="examDateInput" style="background:var(--surface2);border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:8px 10px;font-size:14px;">
    </div>
    <button class="big-btn" id="startBtn">特訓を始める</button>
    <div class="toggle-row">
      <div><div>音声読み上げ</div><div class="sub">単語・例文・リスニングを発音</div></div>
      <label class="switch"><input type="checkbox" id="voice" checked><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <div style="flex:1"><div>読み上げ速度</div><div class="sub" id="rateLbl">標準</div></div>
      <input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="0.92" style="width:130px">
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="brand">
      <div class="logo">TOEIC 800<span class="pro">PRO</span></div>
      <div class="count" id="hcount"></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="vocab">単語<span class="sub">VOCAB</span></div>
      <div class="tab" data-tab="grammar">文法<span class="sub">SPEED</span></div>
      <div class="tab" data-tab="listen">聴解<span class="sub">PART2</span></div>
    </div>
  </header>

  <div class="wrap">
    <div class="countdown" id="countdown">
      <span class="lbl">試験日まで</span>
      <span class="days" id="daysLeft">タップして設定</span>
    </div>

    <div class="modes" id="modes"></div>

    <div class="pbar-wrap">
      <div class="pbar"><i id="pbar" style="width:0%"></i></div>
      <div class="pmeta"><span id="pcount">0 / 0</span><span id="paccu">正答率 –</span></div>
    </div>

    <!-- timer (grammar only) -->
    <div class="timer hidden" id="timer"><div class="t" id="tnum">10</div><div class="tbar"><i id="tbar"></i></div></div>

    <div id="stage"></div>

    <div class="foot"><button id="reset">学習記録をリセット</button></div>
  </div>
</div>

<script>
/* ============================ DATA ============================ */
const VOCAB = [
 {w:"streamline",p:"v.",j:"効率化する",d:["中断する","複雑にする","延期する"],ex:[{e:"We streamlined the approval process.",t:"承認手続きを効率化した。"},{e:"The new system streamlines our workflow.",t:"新システムは業務を効率化する。"}]},
 {w:"consolidate",p:"v.",j:"統合する",d:["分割する","放棄する","拡散する"],ex:[{e:"They consolidated three offices into one.",t:"3つの拠点を1つに統合した。"},{e:"Let's consolidate the reports.",t:"報告書を統合しよう。"}]},
 {w:"expedite",p:"v.",j:"早める",d:["遅らせる","拒否する","記録する"],ex:[{e:"Please expedite the shipment.",t:"出荷を早めてください。"},{e:"We can expedite your order for a fee.",t:"有料で注文を早められます。"}]},
 {w:"endorse",p:"v.",j:"支持する",d:["否定する","隠す","売却する"],ex:[{e:"The board endorsed the plan.",t:"取締役会は計画を支持した。"},{e:"She endorsed the candidate publicly.",t:"彼女は公にその候補を支持した。"}]},
 {w:"allocate",p:"v.",j:"割り当てる",d:["回収する","破棄する","延長する"],ex:[{e:"We allocated more budget to marketing.",t:"販促に多く予算を割り当てた。"},{e:"Resources were allocated by region.",t:"資源は地域別に割り当てられた。"}]},
 {w:"accommodate",p:"v.",j:"収容する",d:["排除する","短縮する","強調する"],ex:[{e:"The hall accommodates 500 people.",t:"その会場は500人を収容できる。"},{e:"We can accommodate your request.",t:"ご要望にお応えできます。"}]},
 {w:"compensate",p:"v.",j:"補償する",d:["請求する","無視する","中止する"],ex:[{e:"We will compensate you for the delay.",t:"遅延について補償します。"},{e:"Bonuses compensate for the long hours.",t:"賞与が長時間労働を補う。"}]},
 {w:"reinforce",p:"v.",j:"強化する",d:["弱める","模倣する","配布する"],ex:[{e:"The data reinforces our strategy.",t:"そのデータは戦略を強化する。"},{e:"We reinforced the structure.",t:"構造を補強した。"}]},
 {w:"undertake",p:"v.",j:"引き受ける",d:["辞退する","中断する","委任する"],ex:[{e:"She undertook the project alone.",t:"彼女は一人で案件を引き受けた。"},{e:"We will undertake a full review.",t:"全面的な見直しを行う。"}]},
 {w:"underscore",p:"v.",j:"強調する",d:["省略する","否定する","延期する"],ex:[{e:"The report underscores the risk.",t:"報告書はそのリスクを強調する。"},{e:"He underscored the deadline.",t:"彼は締切を強調した。"}]},
 {w:"mitigate",p:"v.",j:"緩和する",d:["悪化させる","強要する","記録する"],ex:[{e:"Steps were taken to mitigate the risk.",t:"リスク緩和の措置がとられた。"},{e:"This will mitigate the impact.",t:"これは影響を和らげる。"}]},
 {w:"facilitate",p:"v.",j:"促進する",d:["妨げる","中止する","隠す"],ex:[{e:"The tool facilitates collaboration.",t:"その道具は協働を促進する。"},{e:"She facilitated the meeting.",t:"彼女が会議を進行した。"}]},
 {w:"diminish",p:"v.",j:"減少する",d:["増大する","維持する","公開する"],ex:[{e:"Demand has diminished sharply.",t:"需要は急激に減少した。"},{e:"Nothing can diminish his effort.",t:"彼の努力は損なわれない。"}]},
 {w:"retain",p:"v.",j:"保持する",d:["放出する","拒否する","交換する"],ex:[{e:"We aim to retain top talent.",t:"優秀な人材を維持したい。"},{e:"Please retain your receipt.",t:"領収書を保管してください。"}]},
 {w:"yield",p:"v.",j:"生み出す",d:["浪費する","拒む","削除する"],ex:[{e:"The investment yielded high returns.",t:"その投資は高い利益を生んだ。"},{e:"The trial yielded clear results.",t:"試験は明確な結果を生んだ。"}]},
 {w:"comply",p:"v.",j:"従う",d:["反抗する","提案する","延期する"],ex:[{e:"All staff must comply with the rules.",t:"全員が規則に従う必要がある。"},{e:"The factory complies with the standard.",t:"工場は基準に準拠している。"}]},
 {w:"adhere",p:"v.",j:"順守する",d:["逸脱する","撤回する","模倣する"],ex:[{e:"We adhere to strict guidelines.",t:"厳格な指針を順守する。"},{e:"Please adhere to the schedule.",t:"予定を守ってください。"}]},
 {w:"convene",p:"v.",j:"招集する",d:["解散する","延期する","欠席する"],ex:[{e:"The committee will convene Monday.",t:"委員会は月曜に招集される。"},{e:"They convened an emergency meeting.",t:"緊急会議を招集した。"}]},

/* ============================ STATE / STORAGE ============================ */
const LS="toeic800pro_v1";
let mem={};
const Store={
  get(k){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return mem[k]||null;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;} },
  del(k){ try{localStorage.removeItem(k);}catch(e){delete mem[k];} }
};
let state = Store.get(LS) || {examDate:null,settings:{voice:true,rate:0.92},v:{},g:{},l:{}};
state.settings = state.settings || {voice:true,rate:0.92};
state.v=state.v||{}; state.g=state.g||{}; state.l=state.l||{};
function save(){ Store.set(LS,state); }

/* ---------- audio ---------- */
let synth = window.speechSynthesis || null;
function speak(text, opts){
  if(!state.settings.voice || !synth) return;
  try{
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=(opts&&opts.rate)||state.settings.rate; u.pitch=1;
    synth.speak(u);
  }catch(e){}
}
function unlockAudio(){ if(synth){ try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u);}catch(e){} } }

/* ---------- weighting ---------- */
function vStat(w){ return state.v[w] || {s:0,r:0,wr:0}; }
function vWeight(w){ const st=vStat(w); let wt=1+st.wr*2.2-st.r*0.6; if(st.r>=3&&st.wr===0)wt=0.25; return Math.max(0.2,wt); }
function isStar(w){ const st=vStat(w); return st.wr>=2; }
function gStat(i){ return state.g[i]||{r:0,wr:0}; }
function lStat(i){ return state.l[i]||{r:0,wr:0}; }

function weightedPick(items, weightFn, n){
  const pool=items.map((it,idx)=>({it,idx,w:weightFn(it,idx)}));
  const out=[]; const used=new Set();
  for(let k=0;k<n && used.size<pool.length;k++){
    const avail=pool.filter(p=>!used.has(p.idx));
    let tot=avail.reduce((s,p)=>s+p.w,0); let rnd=Math.random()*tot; let chosen=avail[0];
    for(const p of avail){ rnd-=p.w; if(rnd<=0){chosen=p;break;} }
    used.add(chosen.idx); out.push(chosen.idx);
  }
  return out;
}

/* ============================ RENDER ============================ */
const SESSION_LEN=12;

function buildQueue(){
  qi=0; sessionRight=0; sessionTotal=0;
  if(tab==="vocab"){
    let idxs=VOCAB.map((_,i)=>i);
    if(mode==="weak") idxs=idxs.filter(i=>isStar(VOCAB[i].w)||vStat(VOCAB[i].w).wr>0);
    if(idxs.length===0) idxs=VOCAB.map((_,i)=>i);
    const wf=(it)=>vWeight(VOCAB[it].w===undefined?it.w:VOCAB[it].w?VOCAB[it].w:it);
    queue=weightedPick(idxs.map(i=>VOCAB[i]),(it)=>vWeight(it.w),Math.min(SESSION_LEN,idxs.length)).map(k=>idxs[k]);
  } else if(tab==="grammar"){
    let idxs=GRAMMAR.map((_,i)=>i);
    if(mode==="weak") idxs=idxs.filter(i=>gStat(i).wr>0);
    if(idxs.length===0) idxs=GRAMMAR.map((_,i)=>i);
    shuffle(idxs); queue=idxs.slice(0,Math.min(SESSION_LEN,idxs.length));
  } else {
    let idxs=LISTEN.map((_,i)=>i);
    if(mode==="weak") idxs=idxs.filter(i=>lStat(i).wr>0);
    if(idxs.length===0) idxs=LISTEN.map((_,i)=>i);
    shuffle(idxs); queue=idxs.slice(0,Math.min(SESSION_LEN,idxs.length));
  }
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }

function renderModes(){
  const m=$("modes"); m.innerHTML="";
  let chips=[];
  if(tab==="grammar"){
    chips=[["10s","10秒"],["20s","20秒"],["free","制限なし"],["weak","★弱点"]];
    if(!["10s","20s","free","weak"].includes(mode)) mode="10s";
  } else {
    chips=[["all","全範囲"],["weak","★弱点のみ"]];
    if(!["all","weak"].includes(mode)) mode="all";
  }
  chips.forEach(([k,label])=>{
    const c=document.createElement("div");
    c.className="chip"+(mode===k?" on":""); c.textContent=label;
    c.onclick=()=>{ mode=k; renderModes(); startSession(); };
    m.appendChild(c);
  });
}

function timerSeconds(){ if(mode==="10s")return 10; if(mode==="20s")return 20; return 0; }

function startSession(){
  clearTimer();
  buildQueue();
  renderQuestion();
}

function updateProgress(){
  const total=queue.length;
  $("pcount").textContent=`${Math.min(qi+1,total)} / ${total}`;
  $("pbar").style.width=(total?(qi/total*100):0)+"%";
  $("paccu").textContent= sessionTotal? `正答率 ${Math.round(sessionRight/sessionTotal*100)}%` : "正答率 –";
  $("hcount").innerHTML = tab==="vocab"?`単語 <b>${VOCAB.length}</b>`:tab==="grammar"?`文法 <b>${GRAMMAR.length}</b>`:`聴解 <b>${LISTEN.length}</b>`;
}

function clearTimer(){ if(timerId){clearInterval(timerId);timerId=null;} $("timer").classList.add("hidden"); }

function renderQuestion(){
  answered=false; advArmed=false; clearTimer();
  updateProgress();
  if(qi>=queue.length){ return renderDone(); }
  if(tab==="vocab") renderVocab();
  else if(tab==="grammar") renderGrammar();
  else renderListen();
}

/* ----- VOCAB ----- */
function renderVocab(){
  const it=VOCAB[queue[qi]];
  const opts=[it.j,...it.d]; const correct=it.j;
  shuffle(opts);
  const star=isStar(it.w)?'<span class="star">★</span>':'';
  $("stage").innerHTML=`
    <div class="card">
      <div class="qcat">${it.p==="v."?"動詞":it.p==="adj."?"形容詞":"名詞"}・意味を選択</div>
      <div class="word">${it.w}<span class="pos">${it.p}</span>${star}</div>
      <div style="margin-top:10px"><button class="replay" id="rep">🔊 発音</button></div>
      <div class="opts" id="opts"></div>
      <div id="post"></div>
    </div>`;
  $("rep").onclick=()=>speak(it.w);
  speak(it.w);
  const ob=$("opts");
  opts.forEach((o,k)=>{
    const b=document.createElement("button"); b.className="opt";
    b.innerHTML=`<span class="k">${"ABCD"[k]}</span>${o}`;
    b.onclick=()=>answerVocab(b,o===correct,it,ob);
    ob.appendChild(b);
  });
}
function answerVocab(btn,ok,it,ob){
  if(answered)return; answered=true;
  const st=vStat(it.w); st.s++; ok?st.r++:st.wr++; state.v[it.w]=st; save();
  sessionTotal++; if(ok)sessionRight++;
  [...ob.children].forEach(b=>{ b.disabled=true;
    const isC=b.textContent.replace(/^[ABCD]/,"").trim()===it.j;
    if(isC)b.classList.add("correct"); else if(b===btn&&!ok)b.classList.add("wrong"); else b.classList.add("dim");
  });
  const post=$("post");
  post.innerHTML=`<div class="vex">${it.ex.map(e=>`<div class="row"><div class="e">${e.e}</div><div class="t">${e.t}</div></div>`).join("")}</div>
    <button class="next-btn" id="nv">${qi+1>=queue.length?"結果を見る":"次へ →"}</button>`;
  if(ok){ celebrate(); setTimeout(()=>speak(it.ex[0].e),350); setTimeout(()=>{ advArmed=true; },300); }
  else { speak(it.ex[0].e); }
  $("nv").onclick=()=>{ qi++; renderQuestion(); };
}

/* ----- GRAMMAR ----- */
function renderGrammar(){
  const i=queue[qi]; const it=GRAMMAR[i];
  $("stage").innerHTML=`
    <div class="card">
      <div class="qcat">${it.c}</div>
      <div class="qtext">${it.q.replace("___","<u>?</u>")}</div>
      <div class="opts" id="opts"></div>
      <div id="post"></div>
    </div>`;
  const ob=$("opts"); const order=[0,1,2,3]; shuffle(order);
  order.forEach((oi,k)=>{
    const b=document.createElement("button"); b.className="opt";
    b.innerHTML=`<span class="k">${"ABCD"[k]}</span>${it.o[oi]}`;
    b.onclick=()=>answerGrammar(b,oi===it.a,it,i,ob);
    ob.appendChild(b);
  });
  const secs=timerSeconds();
  if(secs>0) startTimer(secs,()=>{ if(!answered) answerGrammar(null,false,it,i,ob,true); });
}
function startTimer(secs,onEnd){
  const T=$("timer"), num=$("tnum"), bar=$("tbar");
  T.classList.remove("hidden","warn","danger");
  let left=secs; num.textContent=left; bar.style.transition="none"; bar.style.width="100%";
  requestAnimationFrame(()=>{ bar.style.transition=`width ${secs}s linear`; bar.style.width="0%"; });
  timerId=setInterval(()=>{
    left--; num.textContent=Math.max(0,left);
    if(left<=3)T.classList.add("danger"); else if(left<=secs/2)T.classList.add("warn");
    if(left<=0){ clearInterval(timerId); timerId=null; onEnd(); }
  },1000);
}
function answerGrammar(btn,ok,it,i,ob,timeout){
  if(answered)return; answered=true; clearTimer();
  const st=gStat(i); ok?st.r++:st.wr++; state.g[i]=st; save();
  sessionTotal++; if(ok)sessionRight++;
  [...ob.children].forEach(b=>{ b.disabled=true;
    const isC=b.textContent.replace(/^[ABCD]/,"").trim()===it.o[it.a];
    if(isC)b.classList.add("correct"); else if(b===btn&&!ok)b.classList.add("wrong"); else b.classList.add("dim");
  });
  if(ok){
    celebrate();
    $("post").innerHTML=`
      <div class="okjt">
        <div class="jline"><span class="jtag">訳</span>${it.jt}</div>
        <div class="uline">${it.ee}</div>
        <div class="taphint">画面のどこかをタップで次へ →</div>
      </div>`;
    setTimeout(()=>{ advArmed=true; },300);
    setTimeout(()=>{ if(advArmed){ advArmed=false; qi++; renderQuestion(); } },4000);
  } else {
    showLearn(it,timeout);
  }
}
function goNext(){ qi++; renderQuestion(); }
function showLearn(it,timeout){
  const correct=it.o[it.a];
  $("post").innerHTML=`
    <div class="learn">
      <div class="lh"><span class="ic">!</span>学びのチャンス</div>
      <div class="ans">正解 → <span class="en">${correct}</span></div>
      <div class="jline" style="margin-bottom:8px"><span class="jtag">訳</span>${it.jt}</div>
      <div class="exp">${timeout?"⏱ 時間切れ。落ち着いて解説を。<br>":""}${it.ej}<span class="en">${it.ee}</span></div>
      <button class="next-btn" id="ng">理解した・次へ →</button>
    </div>`;
  $("ng").onclick=goNext;
}

/* ----- LISTEN ----- */
function renderListen(){
  const i=queue[qi]; const it=LISTEN[i];
  $("stage").innerHTML=`
    <div class="card">
      <div class="qcat">Part 2 ・ ${it.t}</div>
      <div class="listen-hint">質問を聞いて、最も自然な応答を選んでください</div>
      <div style="text-align:center;margin:6px 0 4px"><button class="replay" id="rep">🔊 もう一度聞く</button></div>
      <div class="opts" id="opts"></div>
      <div id="post"></div>
    </div>`;
  $("rep").onclick=()=>speakListen(it);
  speakListen(it);
  const ob=$("opts"); const order=[0,1,2]; shuffle(order);
  order.forEach((oi,k)=>{
    const b=document.createElement("button"); b.className="opt";
    b.innerHTML=`<span class="k">${"ABC"[k]}</span><span style="opacity:.35">（${"ABC"[k]}）</span>`;
    b.dataset.txt=it.o[oi];
    b.onclick=()=>answerListen(b,oi===it.a,it,i,ob);
    ob.appendChild(b);
  });
}
function speakListen(it){
  if(!state.settings.voice||!synth){ return; }
  try{ synth.cancel();
    const q=new SpeechSynthesisUtterance(it.p); q.lang="en-US"; q.rate=state.settings.rate;
    synth.speak(q);
    ["A","B","C"].forEach((L,k)=>{ const u=new SpeechSynthesisUtterance(L+". "+it.o[k]); u.lang="en-US"; u.rate=state.settings.rate; synth.speak(u); });
  }catch(e){}
}
function answerListen(btn,ok,it,i,ob){
  if(answered)return; answered=true;
  const st=lStat(i); ok?st.r++:st.wr++; state.l[i]=st; save();
  sessionTotal++; if(ok)sessionRight++;
  [...ob.children].forEach(b=>{ b.disabled=true;
    const isC=b.dataset.txt===it.o[it.a];
    b.innerHTML=b.innerHTML.split("<span style")[0]+`<span style="opacity:.85">${b.dataset.txt}</span>`;
    if(isC)b.classList.add("correct"); else if(b===btn&&!ok)b.classList.add("wrong"); else b.classList.add("dim");
  });
  if(ok){ celebrate(); setTimeout(()=>{ advArmed=true; },300); }
  $("post").innerHTML=`
    <div class="${ok?'':'learn'}" style="${ok?'margin-top:14px':''}">
      ${ok?'':'<div class="lh"><span class="ic">!</span>学びのチャンス</div>'}
      <div class="ans"><span class="en">${it.o[it.a]}</span></div>
      <div class="exp">${it.ej}</div>
      <button class="next-btn" id="nl">${qi+1>=queue.length?"結果を見る":"次へ →"}</button>
    </div>`;
  $("nl").onclick=goNext;
}

/* ----- celebration ----- */
function celebrate(){
  const card=document.querySelector(".card"); if(!card)return;
  const b=document.createElement("div"); b.className="burst";
  let rays="";
  for(let i=0;i<12;i++){ rays+=`<div class="ray" style="--rot:${i*30}deg"></div>`; }
  b.innerHTML=`<div class="glow"></div><div class="rays">${rays}</div><div class="yatta">やったね</div>`;
  card.appendChild(b);
  requestAnimationFrame(()=>b.classList.add("go"));
  setTimeout(()=>b.remove(),1100);
}

/* ----- done ----- */
function renderDone(){
  clearTimer();
  const pct=sessionTotal?Math.round(sessionRight/sessionTotal*100):0;
  const msg=pct>=90?"完璧に近い。この調子。":pct>=70?"good。弱点を★モードで詰めよう。":pct>=50?"伸びしろ大。もう1セット。":"基礎から。★弱点モードで反復を。";
  $("stage").innerHTML=`
    <div class="card done">
      <div class="big">${pct>=70?"🎯":"📘"}</div>
      <h2>セッション終了</h2>
      <div class="score">${sessionRight} / ${sessionTotal}</div>
      <p>正答率 ${pct}%<br>${msg}</p>
      <button class="big-btn" id="again" style="margin-top:18px">もう1セット</button>
    </div>`;
  $("again").onclick=startSession;
  $("pbar").style.width="100%";
}

/* ============================ COUNTDOWN ============================ */
function renderCountdown(){
  const el=$("daysLeft");
  if(!state.examDate){ el.textContent="タップして設定"; el.innerHTML='<span style="color:var(--dim)">タップして設定</span>'; return; }
  const d=new Date(state.examDate); const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.ceil((d-today)/86400000);
  el.innerHTML = diff>=0 ? `あと<b>${diff}</b>日` : `<span style="color:var(--dim)">試験日経過</span>`;
}
$("countdown").onclick=()=>{
  const v=prompt("試験日を入力 (例: 2026-07-20)", state.examDate?state.examDate.slice(0,10):"");
  if(v){ const d=new Date(v); if(!isNaN(d.getTime())){ state.examDate=d.toISOString(); save(); renderCountdown(); } }
};

/* ============================ TABS / EVENTS ============================ */
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    tab=t.dataset.tab; mode = tab==="grammar"?"10s":"all";
    renderModes(); startSession();
  };
});

$("voice").onchange=e=>{ state.settings.voice=e.target.checked; if(!state.settings.voice&&synth)synth.cancel(); save(); };
$("rate").oninput=e=>{ state.settings.rate=parseFloat(e.target.value); const v=state.settings.rate; $("rateLbl").textContent=v<0.8?"ゆっくり":v>1.0?"速め":"標準"; };
$("rate").onchange=()=>save();

$("reset").onclick=()=>{
  if(!confirm("学習記録・★弱点をすべて削除します。よろしいですか？"))return;
  Store.del(LS); state={examDate:state.examDate,settings:state.settings,v:{},g:{},l:{}}; save();
  startSession(); renderCountdown();
};

$("startBtn").onclick=()=>{
  unlockAudio();
  state.settings.voice=$("voice").checked;
  state.settings.rate=parseFloat($("rate").value); save();
  $("primer").classList.add("hidden"); $("app").classList.remove("hidden");
  renderModes(); renderCountdown(); startSession();
};

/* ---- exam date (start screen) ---- */
function daysUntil(iso){
  const d=new Date(iso); const today=new Date(); today.setHours(0,0,0,0);
  return Math.ceil((d-today)/86400000);
}
function refreshExamSub(){
  const el=$("examSub");
  if(state.examDate){
    const n=daysUntil(state.examDate);
    el.innerHTML = n>=0 ? `試験まで <b style="color:var(--gold)">あと${n}日</b>` : `<span style="color:var(--dim)">試験日を過ぎています</span>`;
  } else { el.textContent="残り日数を表示します"; }
}
$("examDateInput").onchange=e=>{
  const v=e.target.value;
  if(v){ const d=new Date(v); if(!isNaN(d.getTime())){ state.examDate=d.toISOString(); save(); refreshExamSub(); renderCountdown(); } }
};

/* init start screen */
$("pv").textContent=VOCAB.length; $("pg").textContent=GRAMMAR.length; $("pl").textContent=LISTEN.length;
$("voice").checked=state.settings.voice; $("rate").value=state.settings.rate;
if(state.examDate) $("examDateInput").value=state.examDate.slice(0,10);
refreshExamSub();
(function(){ const v=state.settings.rate; $("rateLbl").textContent=v<0.8?"ゆっくり":v>1.0?"速め":"標準"; })();
</script>
</body>
</html>
